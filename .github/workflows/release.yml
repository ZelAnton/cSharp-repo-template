name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # RELEASE ORDERING INVARIANT (rationale repeated at each relevant step):
      # publishing to NuGet.org is the single IRREVERSIBLE step, so it is the pivot.
      # Everything before it is cheap and reversible (build/test/pack, plus a LOCAL
      # commit+tag that is not yet pushed); everything after it (push the commit+tag
      # to main, create the GitHub Release) is reversible/recreatable and is made
      # idempotent + retried. A structured terminal rejection proves that NuGet did
      # not accept the package, leaves no remote trace, and may be re-run. A timeout,
      # cancellation, or unclassified client failure after an attempt is ambiguous
      # and preserves exact recovery state. Once NuGet accepts the package, never
      # re-run or rebuild this release, even if the tag push failed: recover only
      # from this run's immutable release-recovery-vX.Y.Z artifact. The dispatch
      # commit is captured as one immutable source SHA before checkout. Immediately
      # before the pivot, origin/main must still equal that SHA; the later atomic
      # push advances it only under an exact expected-old lease.
      #
      # The "Push the release commit + tag" step pushes straight to main. If you
      # protect main with a rule that requires pull requests or status checks, that
      # push is rejected unless the pusher can bypass it. This workflow mints a
      # short-lived GitHub App token (repo variable RELEASE_APP_ID + secret
      # RELEASE_APP_PRIVATE_KEY) and checks out with it, so the push runs as the App
      # — add that App to the ruleset's bypass list. Until it is configured the
      # checkout falls back to GITHUB_TOKEN (fine while main is unprotected). Recipe:
      # release-token-bypass.md.
      # Actions are pinned to a full commit SHA (supply-chain hardening); the
      # trailing comment records the human-readable version. Dependabot bumps the
      # SHA and updates the comment on its weekly run.

      # We always release from main. workflow_dispatch still shows GitHub's
      # "Use workflow from" ref picker (it cannot be hidden), so reject any
      # dispatch from a non-main ref up front: otherwise that branch's copy of
      # this workflow file would run — against main, which the checkout below
      # hard-pins — producing a confusing mismatch. Fail fast before any work.
      - name: Guard — release only from main
        run: |
          set -euo pipefail
          # Read the dispatch ref from the built-in $GITHUB_REF env var rather than
          # interpolating the github.ref expression into the script text: a branch
          # name with shell metacharacters (git allows e.g. ';' '|' backticks in ref
          # names) would otherwise inject into this run block. The standard Actions
          # script-injection guard. (Note: an expression placed even in a comment
          # here would still be substituted, so we avoid writing one.)
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release must be dispatched from main (got: $GITHUB_REF). Re-run with 'Use workflow from: main'."
            exit 1
          fi
          echo "Dispatched from main."

      - name: Preflight — required secrets present before any external action
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          # Fail fast, before any irreversible publish or VCS push, if the publish
          # credential is missing — otherwise a missing secret only surfaces at the
          # publish step, after the cheap work has run. If you switch to NuGet
          # Trusted Publishing (OIDC, see the publish step below), drop the
          # NUGET_API_KEY check here and verify id-token availability instead.
          if [[ -z "${NUGET_API_KEY:-}" ]]; then
            echo "::error::NUGET_API_KEY secret is not set. Add it under Settings -> Secrets and variables -> Actions before releasing."
            exit 1
          fi
          echo "Required secrets present."

      # workflow_dispatch supplies the exact commit that contained the workflow
      # selected from main. Capture it before checkout and never resolve the moving
      # branch name as release input later in the job.
      - name: Capture immutable release source
        id: release_source
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA="${DISPATCH_SHA,,}"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The dispatch source is not a full commit SHA (got: '$DISPATCH_SHA')."
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Release source fixed at $SOURCE_SHA."

      # Mint a short-lived GitHub App installation token. Pushing the release commit
      # to `main` with it makes the **App** the actor — and the App sits in the
      # branch-protection ruleset's bypass list, so the push is allowed. The default
      # `github-actions[bot]` CANNOT be granted a ruleset bypass (it's a system actor,
      # not an App), and a PAT would expire; an App token is short-lived, auto-revoked,
      # and needs no rotation. Configure repo variable `RELEASE_APP_ID` + secret
      # `RELEASE_APP_PRIVATE_KEY`; until then this step is skipped and the push falls
      # back to the default `GITHUB_TOKEN` (fine while `main` is unprotected). See the
      # release-token-bypass.md recipe.
      - name: Mint GitHub App token
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ steps.release_source.outputs.sha }}
          fetch-depth: 0
          # Persist the App token so the later `git push` to `main` runs as the App
          # (and thus uses its ruleset bypass). Empty when the App isn't configured →
          # fall back to the default token.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Verify immutable release source checkout
        env:
          SOURCE_SHA: ${{ steps.release_source.outputs.sha }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse --verify HEAD)"
          if [[ "$CHECKED_OUT_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::Checkout resolved to $CHECKED_OUT_SHA instead of immutable release source $SOURCE_SHA."
            exit 1
          fi
          echo "Checked out immutable release source $SOURCE_SHA."

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Determine next version
        id: version
        env:
          SOURCE_SHA: ${{ steps.release_source.outputs.sha }}
        run: |
          set -euo pipefail
          RELEASE_TAGS=()
          while IFS= read -r CANDIDATE; do
            if [[ "$CANDIDATE" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              RELEASE_TAGS+=("$CANDIDATE")
            fi
          done < <(git for-each-ref --merged="$SOURCE_SHA" --sort=version:refname \
            --format='%(refname:strip=2)' refs/tags)

          LATEST_TAG=""
          if (( ${#RELEASE_TAGS[@]} > 0 )); then
            LATEST_TAG="${RELEASE_TAGS[${#RELEASE_TAGS[@]} - 1]}"
          fi
          if [[ -n "$LATEST_TAG" ]]; then
            FIRST_RELEASE=false
            PREVIOUS_TAG="$LATEST_TAG"
            CURRENT="${LATEST_TAG#v}"
            if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Could not parse current version from tag (got: '$CURRENT')"
              exit 1
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "${{ inputs.bump }}" in
              major) NEW="$((MAJOR+1)).0.0" ;;
              minor) NEW="${MAJOR}.$((MINOR+1)).0" ;;
              patch) NEW="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            esac
            echo "Latest release tag: $LATEST_TAG (current=$CURRENT); ${{ inputs.bump }} bump -> $NEW"
          else
            # First release: take the seed version straight from the .csproj <Version>
            # so the published version matches what the repo declares, instead of an
            # implicit 0.0.1 from bumping a synthetic 0.0.0. The bump input is ignored.
            FIRST_RELEASE=true
            PREVIOUS_TAG=""
            CURRENT="0.0.0"
            NEW=$(grep -oP '(?<=<Version>)[^<]+' src/__ProjectName__/__ProjectName__.csproj | head -n1)
            echo "No release tags found; seeding first release from .csproj <Version>=$NEW (bump input ignored)."
          fi
          if [[ ! "$NEW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Computed version '$NEW' is not a valid MAJOR.MINOR.PATCH semver."
            exit 1
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"
          echo "first_release=$FIRST_RELEASE" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not exist
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/${{ steps.version.outputs.tag }}"; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists"
            exit 1
          fi

      - name: Install git-cliff
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: git-cliff@2

      - name: Auto-fill [Unreleased] from git log if empty
        env:
          FIRST_RELEASE: ${{ steps.version.outputs.first_release }}
          PREV_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import sys

          first_release = os.environ["FIRST_RELEASE"] == "true"
          prev_tag = os.environ.get("PREV_TAG", "")
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text()

          m = re.search(r"^## \[Unreleased\]\s*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          if not m:
              print("::error::Could not find '## [Unreleased]' header in CHANGELOG.md", file=sys.stderr)
              sys.exit(1)

          body = m.group(1)
          has_real_bullets = any(re.match(r"^-\s+\S", ln) for ln in body.splitlines())
          if has_real_bullets:
              print("[Unreleased] already has manual entries; skipping auto-fill.")
              sys.exit(0)

          args = ["git-cliff", "--config", "cliff.toml", "--strip", "all"]
          if first_release:
              # With no range, git-cliff processes the full history, including the root commit.
              range_description = "the full commit history"
          else:
              if not prev_tag:
                  print("::error::Previous release tag is missing.", file=sys.stderr)
                  sys.exit(1)
              commit_range = f"{prev_tag}..HEAD"
              args.append(commit_range)
              range_description = f"commits after {prev_tag}"

          print(f"[Unreleased] is empty; generating from {range_description}...")
          result = subprocess.run(
              args,
              check=True,
              capture_output=True,
              text=True,
          )
          generated = result.stdout.strip()
          if not generated:
              print(
                  f"::error::No release-worthy commits found in {range_description}. "
                  "Either add a manual entry to [Unreleased] in CHANGELOG.md, or commit "
                  "changes with a recognised prefix (Add/Fix/Refactor/Update/Remove/...).",
                  file=sys.stderr,
              )
              sys.exit(1)

          new_text = text[: m.start(1)] + generated + "\n\n" + text[m.end(1) :]
          path.write_text(new_text)
          print("----- auto-generated [Unreleased] body -----")
          print(generated)
          print("--------------------------------------------")
          PY

      - name: Bump version in csproj
        run: sed -i -E "s|<Version>[^<]+</Version>|<Version>${{ steps.version.outputs.version }}</Version>|" src/__ProjectName__/__ProjectName__.csproj

      - name: Promote Unreleased section in CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          FIRST_RELEASE: ${{ steps.version.outputs.first_release }}
          PREV_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import pathlib
          import re
          import sys
          from datetime import datetime, timezone

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          first_release = os.environ["FIRST_RELEASE"] == "true"
          prev_tag = os.environ.get("PREV_TAG", "")
          date = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          repo = "https://github.com/__GitHubOwner__/__ProjectName__"

          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text()

          new_unreleased = (
              "## [Unreleased]\n\n"
              "### Added\n-\n\n"
              "### Changed\n-\n\n"
              "### Fixed\n-\n\n"
              f"## [{version}] - {date}"
          )
          text, n = re.subn(r"^## \[Unreleased\]$", new_unreleased, text, count=1, flags=re.M)
          if n != 1:
              print("::error::Could not find '## [Unreleased]' header in CHANGELOG.md", file=sys.stderr)
              sys.exit(1)

          if first_release:
              version_link = f"[{version}]: {repo}/releases/tag/{tag}"
          else:
              if not prev_tag:
                  print("::error::Previous release tag is missing for a subsequent release.", file=sys.stderr)
                  sys.exit(1)
              version_link = f"[{version}]: {repo}/compare/{prev_tag}...{tag}"

          link_replacement = f"[Unreleased]: {repo}/compare/{tag}...HEAD\n{version_link}"
          text, n = re.subn(r"^\[Unreleased\]:.*$", link_replacement, text, count=1, flags=re.M)
          if n != 1:
              print("::error::Could not find '[Unreleased]: ...' reference link in CHANGELOG.md", file=sys.stderr)
              sys.exit(1)

          path.write_text(text)
          PY

      - name: Extract release notes from release section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import pathlib
          import re
          import sys

          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text()
          m = re.search(
              rf"^## \[{re.escape(version)}\](?:\s+-\s+[^\n]+)?\s*\n(.*?)(?=^## \[|\Z)",
              text,
              re.M | re.S,
          )
          body = (m.group(1) if m else "").strip()

          # Keep "### Header" only if it has at least one real bullet ("- text").
          # Drop placeholder "-" lines and empty sections so notes are clean.
          parts = re.split(r"(?m)(^### .+$)", body)
          out = []
          for i in range(1, len(parts), 2):
              header = parts[i]
              section = parts[i + 1] if i + 1 < len(parts) else ""
              bullets = [ln for ln in section.splitlines() if re.match(r"^-\s+\S", ln)]
              if bullets:
                  if out:
                      out.append("")
                  out.append(header)
                  out.extend(bullets)

          result = "\n".join(out).strip()
          if not result:
              print(
                  f"::error::Release section [{version}] in CHANGELOG.md is missing or empty.",
                  file=sys.stderr,
              )
              sys.exit(1)

          pathlib.Path("release-notes.md").write_text(result + "\n")
          print("----- release-notes.md -----")
          print(result)
          print("----------------------------")
          PY

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release /p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack src/__ProjectName__/__ProjectName__.csproj --no-build --configuration Release --output ./artifacts /p:Version=${{ steps.version.outputs.version }}

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd ./artifacts
          files=(*.nupkg *.snupkg)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No package files to hash in ./artifacts."
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      # Create the release commit and tag LOCALLY, but do NOT push yet: the push is
      # a VCS write and must happen AFTER the irreversible NuGet publish (the pivot
      # below). Keeping it local means a failure before NuGet accepts the package
      # leaves nothing on the remote, so a fresh re-run starts clean.
      - name: Commit and tag the release (local only)
        id: release_commit
        env:
          RELEASE_AUTHOR_B64: '__AuthorBase64__'
          RELEASE_AUTHOR_EMAIL_B64: '__AuthorEmailBase64__'
          SOURCE_SHA: ${{ steps.release_source.outputs.sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --verify HEAD)" != "$SOURCE_SHA" ]]; then
            echo "::error::Release inputs are no longer based on immutable source $SOURCE_SHA."
            exit 1
          fi
          release_author="$(printf '%s' "$RELEASE_AUTHOR_B64" | base64 --decode)"
          release_author_email="$(printf '%s' "$RELEASE_AUTHOR_EMAIL_B64" | base64 --decode)"
          git config user.name "$release_author"
          git config user.email "$release_author_email"
          git add src/__ProjectName__/__ProjectName__.csproj CHANGELOG.md
          git commit -m "Release $TAG"
          RELEASE_SHA="$(git rev-parse --verify HEAD)"
          RELEASE_PARENT="$(git rev-parse --verify HEAD^)"
          if [[ "$RELEASE_PARENT" != "$SOURCE_SHA" ]]; then
            echo "::error::Release commit $RELEASE_SHA is not a direct child of immutable source $SOURCE_SHA."
            exit 1
          fi
          git tag "$TAG" "$RELEASE_SHA"
          if [[ "$(git rev-parse --verify "refs/tags/$TAG^{commit}")" != "$RELEASE_SHA" ]]; then
            echo "::error::Release tag $TAG does not resolve to release commit $RELEASE_SHA."
            exit 1
          fi
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Release commit fixed at $RELEASE_SHA (source $SOURCE_SHA)."

      # Keep the exact local release commit/tag available for post-pivot recovery.
      # The bundle stays on the ephemeral runner unless a later post-publish step
      # fails, in which case the final recovery step uploads it with the exact
      # packages and notes produced above.
      - name: Create local release recovery bundle
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.release_source.outputs.sha }}
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --verify HEAD)" != "$RELEASE_SHA" ]] \
             || [[ "$(git rev-parse --verify HEAD^)" != "$SOURCE_SHA" ]] \
             || [[ "$(git rev-parse --verify "refs/tags/$TAG^{commit}")" != "$RELEASE_SHA" ]]; then
            echo "::error::Release commit, parent, or tag drifted before recovery capture."
            exit 1
          fi
          # HEAD was verified above and is intentionally recorded as the bundle's
          # checkout target; a raw object ID alone would clone without a usable HEAD.
          git bundle create ./artifacts/release-recovery.bundle HEAD "refs/tags/$TAG"
          git bundle verify ./artifacts/release-recovery.bundle
          CHECKSUMS_SHA256="$(sha256sum ./artifacts/SHA256SUMS | cut -d' ' -f1)"
          BUNDLE_SHA256="$(sha256sum ./artifacts/release-recovery.bundle | cut -d' ' -f1)"
          NOTES_SHA256="$(sha256sum ./release-notes.md | cut -d' ' -f1)"
          printf '%s\n' \
            'schema=release-recovery-v1' \
            "repository=$GITHUB_REPOSITORY" \
            "source_sha=$SOURCE_SHA" \
            "release_sha=$RELEASE_SHA" \
            "tag=$TAG" \
            "package_checksums_sha256=$CHECKSUMS_SHA256" \
            "bundle_sha256=$BUNDLE_SHA256" \
            "release_notes_sha256=$NOTES_SHA256" \
            > ./artifacts/release-recovery-manifest.txt

      # The NuGet pivot may only consume the immutable dispatch source. Check the
      # authoritative remote ref immediately before the first registry attempt and
      # re-verify the exact local release lineage and recovery payload.
      - name: Guard — remote main unchanged before NuGet pivot
        env:
          SOURCE_SHA: ${{ steps.release_source.outputs.sha }}
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          REMOTE_MAIN="$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          REMOTE_TAG="$(git ls-remote origin "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')"
          if [[ ! "$REMOTE_MAIN" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve origin/main to one full commit SHA."
            exit 1
          fi
          if [[ "$REMOTE_MAIN" != "$SOURCE_SHA" ]]; then
            echo "::error::origin/main moved from immutable release source $SOURCE_SHA" \
              "to $REMOTE_MAIN before NuGet publication."
            echo "::error::No package was published; start a fresh release from the new main."
            exit 1
          fi
          if [[ -n "$REMOTE_TAG" ]]; then
            echo "::error::Remote tag $TAG appeared at $REMOTE_TAG before NuGet publication."
            echo "::error::No package was published; reconcile the existing release state first."
            exit 1
          fi
          if [[ "$(git rev-parse --verify HEAD)" != "$RELEASE_SHA" ]] \
             || [[ "$(git rev-parse --verify HEAD^)" != "$SOURCE_SHA" ]] \
             || [[ "$(git rev-parse --verify "refs/tags/$TAG^{commit}")" != "$RELEASE_SHA" ]]; then
            echo "::error::Release commit, source ancestry, or tag changed before NuGet publication."
            exit 1
          fi
          (
            cd ./artifacts
            sha256sum --check SHA256SUMS
          )
          grep -Fx "source_sha=$SOURCE_SHA" ./artifacts/release-recovery-manifest.txt >/dev/null
          grep -Fx "release_sha=$RELEASE_SHA" ./artifacts/release-recovery-manifest.txt >/dev/null
          grep -Fx "tag=$TAG" ./artifacts/release-recovery-manifest.txt >/dev/null
          CHECKSUMS_SHA256="$(sha256sum ./artifacts/SHA256SUMS | cut -d' ' -f1)"
          BUNDLE_SHA256="$(sha256sum ./artifacts/release-recovery.bundle | cut -d' ' -f1)"
          NOTES_SHA256="$(sha256sum ./release-notes.md | cut -d' ' -f1)"
          grep -Fx "package_checksums_sha256=$CHECKSUMS_SHA256" \
            ./artifacts/release-recovery-manifest.txt >/dev/null
          grep -Fx "bundle_sha256=$BUNDLE_SHA256" \
            ./artifacts/release-recovery-manifest.txt >/dev/null
          grep -Fx "release_notes_sha256=$NOTES_SHA256" \
            ./artifacts/release-recovery-manifest.txt >/dev/null
          echo "Remote main and exact release state are unchanged at the NuGet pivot."

      # === PIVOT: the single irreversible step ===
      # NuGet publishing cannot be undone (a pushed version can only be unlisted,
      # never re-pushed), so it is the pivot and every reversible action is ordered
      # around it. It runs BEFORE the git push and the GitHub Release: if it fails,
      # no tag/commit has reached the remote and no Release exists. A new run is safe
      # only if NuGet did not accept the package.
      # The first attempt never uses `--skip-duplicate`: a 409 there proves that the
      # version predates this run, so the workflow fails closed without publishing
      # this run's tag, Release, checksums, notes, or recovery bundle. Only an in-step
      # retry after an ambiguous attempt uses `--skip-duplicate`, preserving retry
      # idempotence when the registry accepted that attempt but its response was lost.
      # An English, structured terminal 400/401/403/413/415/422 response on the first
      # attempt proves rejection and leaves no remote recovery artifact. Every other
      # failed, timed-out, or cancelled attempt remains ambiguous, so the final step
      # preserves this run's exact recovery state before the job terminates.
      #
      # MORE SECURE ALTERNATIVE — NuGet Trusted Publishing (OIDC): instead of a
      # long-lived NUGET_API_KEY secret, mint a short-lived key per run. Add
      # `id-token: write` to this job's permissions, configure a trusted publisher
      # policy on nuget.org for this repo+workflow, then replace the step below with
      # the `NuGet/login` action to obtain a temporary key (and update the preflight
      # step accordingly). See https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
      - name: Push to NuGet.org (irreversible pivot)
        id: nuget_publish
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          recovery_marker = Path("./artifacts/.nuget-recovery-required")
          confirmed_rejection = re.compile(
              r"Response status code does not indicate success:\s*"
              r"(?:400|401|403|413|415|422)\b",
              re.IGNORECASE,
          )
          pre_existing_version = re.compile(
              r"(?:Response status code does not indicate success:\s*409\b|"
              r"package version already exists)",
              re.IGNORECASE,
          )
          retry_duplicate = re.compile(
              r"(?:Response status code does not indicate success:\s*409\b|"
              r"package(?:\s+version)?[^\r\n]*already exists|"
              r"already exists[^\r\n]*skipping duplicate)",
              re.IGNORECASE,
          )
          direct_upload_success = re.compile(
              r"\byour package was pushed\b",
              re.IGNORECASE,
          )

          def write_output(name, value):
              with output_path.open("a", encoding="utf-8") as output:
                  output.write(f"{name}={value}\n")

          def require_recovery(required):
              write_output("recovery_required", "true" if required else "false")
              if required:
                  recovery_marker.touch()
              else:
                  recovery_marker.unlink(missing_ok=True)

          def emit_text(value, stream):
              if not value:
                  return
              if isinstance(value, bytes):
                  value = value.decode("utf-8", errors="replace")
              stream.write(value)

          def emit_process_output(result):
              emit_text(result.stdout, sys.stdout)
              emit_text(result.stderr, sys.stderr)

          write_output("acceptance", "not-attempted")
          require_recovery(False)

          package_command = [
              "dotnet", "nuget", "push", "./artifacts/*.nupkg",
              "--source", "https://api.nuget.org/v3/index.json",
              "--api-key", os.environ["NUGET_API_KEY"],
              "--no-symbols",
              "--force-english-output",
          ]
          package_accepted = False
          for attempt in range(1, 4):
              if attempt == 1:
                  # This durable local marker survives process cancellation even if
                  # the runner cannot finalize step outputs.
                  write_output("acceptance", "ambiguous")
                  require_recovery(True)
              attempt_command = package_command
              if attempt > 1:
                  # Retry only after this process made an acceptance-ambiguous
                  # attempt. A skipped duplicate still cannot prove that this
                  # process uploaded the occupied version.
                  attempt_command = [*package_command, "--skip-duplicate"]
              try:
                  result = subprocess.run(
                      attempt_command,
                      check=False,
                      capture_output=True,
                      text=True,
                      timeout=300,
                  )
              except subprocess.TimeoutExpired as error:
                  emit_text(error.stdout, sys.stdout)
                  emit_text(error.stderr, sys.stderr)
                  print(f"::warning::NuGet push attempt {attempt} timed out; acceptance remains ambiguous.")
                  if attempt < 3:
                      time.sleep(attempt * 15)
                  continue

              emit_process_output(result)
              response = f"{result.stdout or ''}\n{result.stderr or ''}"
              if result.returncode == 0:
                  if attempt > 1 and retry_duplicate.search(response):
                      print(
                          "::error::NuGet reported a duplicate on retry; the occupied "
                          "version cannot be attributed to this run."
                      )
                      print(
                          "::error::Acceptance remains ambiguous. Preserve this run's "
                          "exact recovery state; do not create its tag or GitHub Release."
                      )
                      break
                  if attempt > 1 and not direct_upload_success.search(response):
                      print(
                          "::error::NuGet retry exited successfully without direct-upload "
                          "confirmation; acceptance remains ambiguous."
                      )
                      break
                  write_output("acceptance", "accepted")
                  package_accepted = True
                  print(f"NuGet package push succeeded (attempt {attempt}).")
                  break

              if attempt == 1 and pre_existing_version.search(response):
                  write_output("acceptance", "pre-existing")
                  require_recovery(False)
                  print(
                      "::error::This NuGet version existed before the current run; "
                      "the current artifacts were not accepted as this release."
                  )
                  print(
                      "::error::No VCS push, GitHub Release, checksum publication, "
                      "or exact-recovery artifact will be created."
                  )
                  sys.exit(1)

              if attempt == 1 and confirmed_rejection.search(response):
                  write_output("acceptance", "rejected")
                  require_recovery(False)
                  print(
                      "::error::NuGet conclusively rejected the package; no registry, "
                      "VCS, Release, or recovery-artifact trace was created."
                  )
                  print("::error::Correct the rejection and re-run the workflow from a fresh release state.")
                  sys.exit(1)

              print(f"::warning::NuGet push attempt {attempt} failed; acceptance remains ambiguous.")
              if attempt < 3:
                  time.sleep(attempt * 15)

          if not package_accepted:
              print("::error::NuGet push failed after 3 attempts. No VCS push or GitHub Release was attempted.")
              print(
                  "::error::NuGet acceptance is ambiguous; the exact recovery state "
                  "will be preserved by the final step."
              )
              print("::error::Do not re-run or rebuild unless the version is confirmed absent on nuget.org.")
              print("::error::If NuGet accepted it, recover only from this run's immutable artifact.")
              sys.exit(1)

          # Publish symbols separately only after the main package is accepted. Any
          # symbol failure is therefore post-pivot and can never be classified as a
          # no-trace rejection of the immutable main package.
          symbol_command = [
              "dotnet", "nuget", "push", "./artifacts/*.snupkg",
              "--source", "https://api.nuget.org/v3/index.json",
              "--api-key", os.environ["NUGET_API_KEY"],
              "--symbol-source", "https://api.nuget.org/v3/index.json",
              "--symbol-api-key", os.environ["NUGET_API_KEY"],
              "--skip-duplicate",
              "--force-english-output",
          ]
          for attempt in range(1, 4):
              try:
                  result = subprocess.run(
                      symbol_command,
                      check=False,
                      capture_output=True,
                      text=True,
                      timeout=300,
                  )
              except subprocess.TimeoutExpired as error:
                  emit_text(error.stdout, sys.stdout)
                  emit_text(error.stderr, sys.stderr)
                  print(f"::warning::NuGet symbol push attempt {attempt} timed out after package acceptance.")
                  if attempt < 3:
                      time.sleep(attempt * 15)
                  continue

              emit_process_output(result)
              if result.returncode == 0:
                  print(f"NuGet symbol push succeeded (attempt {attempt}).")
                  sys.exit(0)
              print(f"::warning::NuGet symbol push attempt {attempt} failed after package acceptance.")
              if attempt < 3:
                  time.sleep(attempt * 15)

          print("::error::The package is ALREADY on nuget.org, but its symbol package did not complete successfully.")
          print("::error::No VCS push or GitHub Release was attempted; use this run's exact recovery artifact.")
          sys.exit(1)
          PY

      # Reversible VCS write, AFTER the pivot. --atomic guarantees the branch and
      # tag move together (or neither does), so we never advance main while losing
      # the tag. If this is rejected (e.g. branch protection — see the checkout
      # note), the package is already on nuget.org. Retry here first; after a terminal
      # failure the final step persists the exact local tag and artifacts for manual
      # recovery without rebuilding or republishing.
      - name: Push the release commit + tag (atomic)
        env:
          SOURCE_SHA: ${{ steps.release_source.outputs.sha }}
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')"
            REMOTE_TAG="$(git ls-remote origin "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')"
            if [[ "$REMOTE_MAIN" == "$RELEASE_SHA" && "$REMOTE_TAG" == "$RELEASE_SHA" ]]; then
              echo "Exact release commit and tag were already pushed by this run."
              exit 0
            fi
            if [[ "$REMOTE_MAIN" != "$SOURCE_SHA" ]]; then
              echo "::error::origin/main is $REMOTE_MAIN, not expected source" \
                "$SOURCE_SHA; refusing to overwrite remote movement."
              break
            fi
            if [[ -n "$REMOTE_TAG" ]]; then
              echo "::error::Remote tag $TAG already exists at $REMOTE_TAG instead of" \
                "exact release commit $RELEASE_SHA."
              break
            fi
            if git push --atomic --force-with-lease="refs/heads/main:$SOURCE_SHA" origin \
                "$RELEASE_SHA:refs/heads/main" "refs/tags/$TAG"; then
              echo "Release commit and tag push succeeded (attempt $attempt)."
              exit 0
            fi
            echo "::warning::Atomic release push attempt $attempt failed; retrying after backoff..."
            sleep $((attempt * 10))
          done
          echo "::error::The package is ALREADY on nuget.org, but the release commit and tag were not pushed."
          echo "::error::Do not rebuild or re-run the whole workflow."
          echo "::error::Download the release-recovery-$TAG artifact saved by the final step, then run:"
          echo "::error::Verify SHA256SUMS and the hashes/SHAs in release-recovery-manifest.txt before continuing."
          echo "::error::git clone ./artifacts/release-recovery.bundle release-recovery"
          echo "::error::git -C release-recovery remote set-url origin https://github.com/${{ github.repository }}.git"
          RECOVERY_PUSH="git -C release-recovery push --atomic"
          RECOVERY_PUSH+=" --force-with-lease=refs/heads/main:$SOURCE_SHA"
          RECOVERY_PUSH+=" origin $RELEASE_SHA:refs/heads/main refs/tags/$TAG"
          echo "::error::$RECOVERY_PUSH"
          exit 1

      # Final, recreatable step, made idempotent (edit the Release if it already
      # exists, else create it) and retried. By now the package is published AND the
      # tag is on main, so a blind re-run of the WHOLE workflow would compute the
      # NEXT version and orphan this release — hence the failure message tells the
      # operator to finish by hand rather than re-running.
      - name: Create or update the GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(./artifacts/*.nupkg ./artifacts/*.snupkg ./artifacts/SHA256SUMS)
          for attempt in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md \
                 && gh release upload "$TAG" "${assets[@]}" --clobber; then
                echo "Updated existing Release $TAG (attempt $attempt)."
                exit 0
              fi
            else
              if gh release create "$TAG" --title "$TAG" --notes-file release-notes.md "${assets[@]}"; then
                echo "Created Release $TAG (attempt $attempt)."
                exit 0
              fi
            fi
            echo "::warning::GitHub Release step attempt $attempt failed; retrying after backoff..."
            sleep $((attempt * 10))
          done
          create_command="gh release create $TAG --title $TAG --notes-file release-notes.md"
          create_command+=" ./artifacts/*.nupkg ./artifacts/*.snupkg ./artifacts/SHA256SUMS"
          edit_command="gh release edit $TAG --notes-file release-notes.md"
          upload_command="gh release upload $TAG ./artifacts/*.nupkg ./artifacts/*.snupkg"
          upload_command+=" ./artifacts/SHA256SUMS --clobber"
          echo "::error::GitHub Release failed after 3 attempts; package and tag are ALREADY published."
          echo "::error::Do NOT re-run the workflow; it would compute the next version."
          echo "::error::Download release-recovery-$TAG from this run. If the Release is missing: '$create_command'."
          echo "::error::If it exists: '$edit_command && $upload_command'."
          exit 1

      # Runs after an accepted publish followed by a later failure, or after an
      # attempted publish whose failure, timeout, or cancellation leaves acceptance
      # ambiguous. The marker is authoritative when cancellation prevents the runner
      # from finalizing step outputs. A confirmed rejection removes both guards.
      # Persist the exact package, notes, checksums, and local release commit/tag so
      # recovery never rebuilds or substitutes post-pivot artifacts. Failures before
      # the first publish attempt leave recovery-required false (or the step skipped).
      - name: Preserve exact post-pivot recovery state
        if: >-
          ${{
            always() && (failure() || cancelled()) &&
            (
              steps.nuget_publish.outputs.recovery_required == 'true' ||
              hashFiles('artifacts/.nuget-recovery-required') != ''
            )
          }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-recovery-${{ steps.version.outputs.tag }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            artifacts/SHA256SUMS
            artifacts/release-recovery.bundle
            artifacts/release-recovery-manifest.txt
            release-notes.md
          if-no-files-found: error
          retention-days: 30
